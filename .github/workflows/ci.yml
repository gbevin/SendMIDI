name: CI

# Builds SendMIDI and its unit-test suite on macOS, Linux (64-bit and 32-bit
# i686) and Windows, then runs the tests and smoke-checks the binary. The i686
# job also runs the tests under Valgrind to catch memory errors that only a
# 32-bit allocator tends to expose (see issue #61). JUCE is vendored under
# JuceLibraryCode/modules, so no framework needs to be fetched -- the committed
# Projucer build files are used as-is.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout ReceiveMIDI for the end-to-end tests
        uses: actions/checkout@v5
        with:
          repository: gbevin/ReceiveMIDI
          path: e2e/receivemidi

      # ---------------------------------------------------------------- macOS
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          xcodebuild -project Builds/MacOSX/sendmidi.xcodeproj \
            -target "sendmidi - ConsoleApp" -configuration Release SYMROOT=build build
          xcodebuild -project Tests/Builds/MacOSX/SendMIDITests.xcodeproj \
            -target "SendMIDITests - ConsoleApp" -configuration Release SYMROOT=build build

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: ./Tests/Builds/MacOSX/build/Release/SendMIDITests

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./Builds/MacOSX/build/Release/sendmidi --version | grep -q "sendmidi v"

      - name: Build the other tools for the end-to-end tests (macOS)
        if: runner.os == 'macOS'
        run: |
          xcodebuild -project e2e/receivemidi/Builds/MacOSX/receivemidi.xcodeproj \
            -target "receivemidi - ConsoleApp" -configuration Release SYMROOT=build build

      - name: End-to-end test (macOS)
        if: runner.os == 'macOS'
        # drives the built binary through virtual MIDI ports together with the
        # other tools, built from their current sources
        run: |
          ./Scripts/e2e-test.sh ./Builds/MacOSX/build/Release/sendmidi \
            e2e/receivemidi/Builds/MacOSX/build/Release/receivemidi

      # ---------------------------------------------------------------- Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev qemu-system-x86 cloud-image-utils

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make -C Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"
          make -C Tests/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ./Tests/Builds/LinuxMakefile/build/SendMIDITests

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./Builds/LinuxMakefile/build/sendmidi --version | grep -q "sendmidi v"

      - name: Build the other tools for the end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: |
          make -C e2e/receivemidi/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"

      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        # the runner kernels are built without sound support, so there is no ALSA
        # sequencer to make virtual MIDI ports with; these tests run in a guest
        # whose kernel has one
        run: |
          sudo chmod 666 /dev/kvm
          ./Scripts/linux-guest-test.sh ./Scripts/e2e-test.sh ./Builds/LinuxMakefile/build/sendmidi e2e/receivemidi/Builds/LinuxMakefile/build/receivemidi

      # -------------------------------------------------------------- Windows
      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          msbuild Builds/VisualStudio2022/sendmidi.sln /m /p:Configuration=Release /p:Platform=x64
          msbuild Tests/Builds/VisualStudio2022/SendMIDITests.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\Tests\Builds\VisualStudio2022\x64\Release\ConsoleApp\SendMIDITests.exe

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./Builds/VisualStudio2022/x64/Release/ConsoleApp/sendmidi.exe --version | grep -q "sendmidi v"

      - name: Build the other tools for the end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: |
          msbuild e2e/receivemidi/Builds/VisualStudio2022/receivemidi.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Install a loopback MIDI port (Windows)
        if: runner.os == 'Windows'
        # the Win32 MIDI API has no virtual ports, so loopMIDI provides them; its
        # ports only exist while its tray application runs and come from the
        # registry, so two are seeded there, with a press of the "+" button of
        # its window as the fallback
        shell: pwsh
        run: |
          winget install --id TobiasErichsen.loopMIDI --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $exe = Get-ChildItem -Path "${env:ProgramFiles}\Tobias Erichsen\loopMIDI\loopMIDI.exe", "${env:ProgramFiles(x86)}\Tobias Erichsen\loopMIDI\loopMIDI.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "loopMIDI.exe was not installed" }
          reg add "HKCU\Software\Tobias Erichsen\loopMIDI\Ports" /v "loopMIDI Port" /t REG_DWORD /d 1 /f | Out-Null
          reg add "HKCU\Software\Tobias Erichsen\loopMIDI\Ports" /v "loopMIDI Port 2" /t REG_DWORD /d 1 /f | Out-Null
          Start-Process -FilePath $exe.FullName
          $port = $null
          foreach ($i in 1..30) {
            Start-Sleep -Milliseconds 500
            $port = & .\Builds\VisualStudio2022\x64\Release\ConsoleApp\sendmidi.exe list | Where-Object { $_ -match 'loopMIDI' } | Select-Object -First 1
            if ($port) { break }
          }
          if (-not $port) {
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $window = $null
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            $window = $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition) | Where-Object { $_.Current.Name -like 'loopMIDI*' } | Select-Object -First 1
            if ($window) { break }
          }
          if (-not $window) { throw "the loopMIDI window did not appear" }
          $plus = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | Where-Object { $_.Current.Name -eq '+' } | Select-Object -First 1
          if (-not $plus) {
            $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { "{0} [{1}]" -f $_.Current.Name, $_.Current.ControlType.ProgrammaticName }
            throw "the + button was not found in the loopMIDI window"
          }
          "+ is a {0} with patterns: {1}" -f $plus.Current.ControlType.ProgrammaticName, (($plus.GetSupportedPatterns() | ForEach-Object { $_.ProgrammaticName }) -join ', ')
          Add-Type -Namespace Native -Name Win -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr hWnd); [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, System.UIntPtr extra);'
          [Native.Win]::SetForegroundWindow([System.IntPtr]$window.Current.NativeWindowHandle) | Out-Null
          try {
            $plus.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          } catch {
            try {
              $plus.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern).DoDefaultAction()
            } catch {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $point = $plus.GetClickablePoint()
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]$point.X, [int]$point.Y)
              [Native.Win]::mouse_event(2, 0, 0, 0, [System.UIntPtr]::Zero)
              [Native.Win]::mouse_event(4, 0, 0, 0, [System.UIntPtr]::Zero)
            }
          }
          }
          $port = $null
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            $port = & .\Builds\VisualStudio2022\x64\Release\ConsoleApp\sendmidi.exe list | Where-Object { $_ -match 'loopMIDI' } | Select-Object -First 1
            if ($port) { break }
          }
          try { reg query "HKCU\Software\Tobias Erichsen\loopMIDI" /s } catch { }
          if (-not $port) { & .\Builds\VisualStudio2022\x64\Release\ConsoleApp\sendmidi.exe list; throw "no loopMIDI port appeared" }
          "E2E_PORT=$($port.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: End-to-end test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./Scripts/e2e-test.sh ./Builds/VisualStudio2022/x64/Release/ConsoleApp/sendmidi.exe \
            e2e/receivemidi/Builds/VisualStudio2022/x64/Release/ConsoleApp/receivemidi.exe

  # Separate job: a 32-bit (i686) build on an amd64 runner via the multilib
  # toolchain, exercised natively and under Valgrind. A 32-bit allocator lays
  # memory out differently, so use-after-free bugs that pass by luck on 64-bit
  # surface here -- this is the configuration that reported issue #61.
  linux-i686:
    name: Linux i686
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install 32-bit toolchain, ALSA and Valgrind
        # libc6-dbg:i386 ships the 32-bit ld.so symbols Valgrind must redirect
        # (strlen in ld-linux.so.2); without it Valgrind aborts at startup
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libasound2-dev:i386 valgrind libc6-dbg:i386

      # TARGET_ARCH flows into the compile and link flags; PKG_CONFIG_PATH points
      # pkg-config at the 32-bit ALSA so the right library gets linked. Debug is
      # used so Valgrind can report file/line for any error it finds.
      - name: Build 32-bit (Debug)
        env:
          PKG_CONFIG_PATH: /usr/lib/i386-linux-gnu/pkgconfig
        run: |
          make -C Builds/LinuxMakefile CONFIG=Debug TARGET_ARCH=-m32 -j"$(nproc)"
          make -C Tests/Builds/LinuxMakefile CONFIG=Debug TARGET_ARCH=-m32 -j"$(nproc)"

      - name: Confirm the binaries are 32-bit
        run: |
          file ./Builds/LinuxMakefile/build/sendmidi | grep -q "ELF 32-bit"
          file ./Tests/Builds/LinuxMakefile/build/SendMIDITests | grep -q "ELF 32-bit"

      - name: Run tests (i686)
        run: ./Tests/Builds/LinuxMakefile/build/SendMIDITests

      # --undef-value-errors=no and --leak-check=no keep Valgrind's noisier
      # checks off; --error-exitcode=1 still fails the job on heap addressing
      # errors (invalid read/write, use-after-free) -- the class behind issue #61.
      - name: Run tests under Valgrind (i686)
        run: |
          valgrind --error-exitcode=1 --leak-check=no --undef-value-errors=no \
            ./Tests/Builds/LinuxMakefile/build/SendMIDITests

      - name: Smoke test (i686)
        run: ./Builds/LinuxMakefile/build/sendmidi --version | grep -q "sendmidi v"

